<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden — Musik Lizenzen</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1c1917;
      --muted: #57534e;
      --card: #fffcf7;
      --line: #d6d3d1;
      --accent: #1d4e3e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .card {
      width: min(100% - 2rem, 22rem);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1.35rem 1.25rem 1.5rem;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.35rem; }
    p { margin: 0 0 1rem; color: var(--muted); font-size: 0.95rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem; }
    input[type="password"] {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
    }
    button {
      margin-top: 1rem;
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 0.6rem 1rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .err {
      background: #fee2e2;
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 0.7rem 0.85rem;
      margin: 0 0 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Musik Lizenzen</h1>
    <p>Internes Audit — bitte Passwort eingeben.</p>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next or '/' }}">
      <label for="password">Passwort</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        autofocus
      >
      <button type="submit">Anmelden</button>
    </form>
  </div>
</body>
</html>
